  <style>
    .content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 99vw;
      align-items: center;
      justify-content: center;
    }

    .content>h1 {
      font-size: 70px;

    }

    .animate {
      transform: rotateX(90deg);
      transition-duration: 3s;
      transform-origin: bottom;
      font-size: 60px;
      text-align: center;
    }

    .animate.show {
      transform: rotateX(0deg);
    }
    .slideImage {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      overflow: hidden;
    }

    @media (max-width: 500px) {
      .slideImage {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 20px;
        overflow: hidden;
      }
    }

    .slideImage>div>img {
      height: 500px;
      width: 100%;
    }

    .slideImage>div {
      margin: 20px;

    }

    .slideImage>div>.left {
      transform: translateX(-100%) translateY(50%) rotate(-30deg);
      transition-duration: 3s;
    }

    .slideImage>div>.right {
      transform: translateX(100%) translateY(20%) rotate(30deg);
      transition-duration: 3s;
    }
    .content.art {
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* Ensures flex children align to the left */
  text-align: left;        /* Aligns text content inside elements to the left */
  width: 100%;
  padding-left: 2rem;      /* Optional: prevents text from sticking directly to the screen edge */
}

.content.art .animate.text {
  text-align: left;
  margin-left: 0;          /* Overrides any auto margins or centering */
  width: auto;             /* Or 100% depending on whether you want full-width containers */
}
.archives{
    display: grid;
    grid-template-columns: repeat(4,1fr);
    row-gap: 150px;
    
}
.archives > div{
    
    height: 100px;
    width: 150px;
    
    overflow: hidden;
    position: relative;

}
.archives img{
    height: 100%;
    width: 100%;
    object-fit: cover;
    object-position: center;
}

<script>
  let texts = document.querySelectorAll(".content > .animate");
  let images = document.querySelectorAll(".slideImage > div > img")



  let observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.classList.add("show")
      }
      else {
        entry.target.classList.remove("show")
      }
    })
  })

  texts.forEach((text) => {
    observer.observe(text);
  })
  
   let observer2 = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.style.transform = "translateX(0%)"
      }
    })
  })

  images.forEach((img) => {
    observer2.observe(img)
  })

   let service = document.querySelectorAll(".art > .animate");

  service.forEach((element) => {
    console.log(element)
    element.addEventListener("mouseenter", (event) => {
      console.log(event.target.innerText)

      service.forEach((text) => {
        if (text.innerText != event.target.innerText) {
          text.style.color = "gray"
        }
        else {
          text.style.color = "black"
        }
      })

    })
  })
  </script>
